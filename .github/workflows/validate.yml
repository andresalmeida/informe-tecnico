name: Validar skill y motor PDF

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar ejemplo y regresiones
        run: python skills/informe-tecnico/scripts/self_test.py
      - name: Comprobar muestra publicada
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-informe-tecnico.pdf
      - name: Comprobar muestra institucional con criterios APA
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-perfil-apa.pdf
      - name: Comprobar muestra publicada de procedimientos y avisos
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-procedimientos-avisos.pdf
      - name: Compilar y comprobar ejemplo de procedimientos y avisos
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-procedimientos.json --output output/procedimientos.pdf
          python skills/informe-tecnico/scripts/check_report.py output/procedimientos.pdf
