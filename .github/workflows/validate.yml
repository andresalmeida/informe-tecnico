name: Validar skill y motor PDF

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar ejemplo y regresiones
        run: python tests/self_test.py
      - name: Comprobar muestra publicada
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-informe-tecnico.pdf
      - name: Comprobar muestra institucional con criterios APA
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-perfil-apa.pdf
      - name: Comprobar muestra publicada de procedimientos y avisos
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-procedimientos-avisos.pdf
      - name: Comprobar las muestras publicadas de actas
        run: |
          python skills/informe-tecnico/scripts/check_report.py docs/muestra-acta-entrega.pdf
          python skills/informe-tecnico/scripts/check_report.py docs/muestra-acta-reunion.pdf
      - name: Comprobar la muestra publicada del informe de factibilidad
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-informe-factibilidad.pdf
      - name: Comprobar la muestra publicada del informe de factibilidad completo
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-informe-factibilidad-completo.pdf
      - name: Comprobar la muestra publicada del registro de requerimientos
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-registro-requerimientos.pdf
      - name: Comprobar la muestra publicada del alcance del proyecto
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-alcance-proyecto.pdf
      - name: Comprobar la muestra publicada del acta de capacitación
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-acta-capacitacion.pdf
      - name: Comprobar la muestra publicada del plan de pruebas
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-plan-pruebas.pdf
      - name: Compilar y comprobar ejemplo del acta de entrega
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-acta-entrega.json --output output/entrega.pdf
          python skills/informe-tecnico/scripts/check_report.py output/entrega.pdf
      - name: Compilar y comprobar ejemplo del plan de pruebas
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-plan-pruebas.json --output output/plan-pruebas.pdf
          python skills/informe-tecnico/scripts/check_report.py output/plan-pruebas.pdf
      - name: Compilar y comprobar ejemplo de procedimientos y avisos
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-procedimientos.json --output output/procedimientos.pdf
          python skills/informe-tecnico/scripts/check_report.py output/procedimientos.pdf
      - name: Compilar y comprobar ejemplo del informe de factibilidad
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-informe-factibilidad.json --output output/factibilidad.pdf
          python skills/informe-tecnico/scripts/check_report.py output/factibilidad.pdf
      - name: Compilar y comprobar ejemplo del informe de factibilidad completo
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-informe-factibilidad-completo.json --output output/factibilidad-completo.pdf
          python skills/informe-tecnico/scripts/check_report.py output/factibilidad-completo.pdf
      - name: Compilar y comprobar ejemplo del registro de requerimientos
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-registro-requerimientos.json --output output/registro.pdf
          python skills/informe-tecnico/scripts/check_report.py output/registro.pdf
      - name: Compilar y comprobar ejemplo del alcance del proyecto
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-alcance-proyecto.json --output output/alcance.pdf
          python skills/informe-tecnico/scripts/check_report.py output/alcance.pdf
      - name: Compilar y comprobar ejemplo del acta de capacitación
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-acta-capacitacion.json --output output/capacitacion.pdf
          python skills/informe-tecnico/scripts/check_report.py output/capacitacion.pdf
      - name: Comprobar la muestra publicada del registro de riesgos
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-registro-riesgos.pdf
      - name: Compilar y comprobar ejemplo del registro de riesgos
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-registro-riesgos.json --output output/riesgos.pdf
          python skills/informe-tecnico/scripts/check_report.py output/riesgos.pdf
      - name: Comprobar la muestra publicada de la propuesta de servicio
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-propuesta-servicio.pdf
      - name: Compilar y comprobar ejemplo de la propuesta de servicio
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-propuesta-servicio.json --output output/propuesta.pdf
          python skills/informe-tecnico/scripts/check_report.py output/propuesta.pdf
      - name: Comprobar la muestra publicada de decision-arquitectura
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-decision-arquitectura.pdf
      - name: Compilar y comprobar ejemplo de decision-arquitectura
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-decision-arquitectura.json --output output/decision-arquitectura.pdf
          python skills/informe-tecnico/scripts/check_report.py output/decision-arquitectura.pdf
      - name: Comprobar la muestra publicada de descripcion-arquitectura
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-descripcion-arquitectura.pdf
      - name: Compilar y comprobar ejemplo de descripcion-arquitectura
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-descripcion-arquitectura.json --output output/descripcion-arquitectura.pdf
          python skills/informe-tecnico/scripts/check_report.py output/descripcion-arquitectura.pdf
      - name: Comprobar la muestra publicada de la especificación de requisitos
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-especificacion-requisitos.pdf
      - name: Compilar y comprobar ejemplo de la especificación de requisitos
        run: |
