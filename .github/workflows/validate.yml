      - name: Comprobar la muestra publicada del traspaso a operación
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-traspaso-operacion.pdf
      - name: Compilar y comprobar ejemplo del traspaso a operación
        run: |
