      - name: Comprobar la muestra publicada de ficha-proceso
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-ficha-proceso.pdf
      - name: Compilar y comprobar ejemplo de ficha-proceso
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-ficha-proceso.json --output output/ficha-proceso.pdf
          python skills/informe-tecnico/scripts/check_report.py output/ficha-proceso.pdf
      - name: Comprobar la muestra publicada de la solicitud de cambio
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-solicitud-cambio.pdf
      - name: Compilar y comprobar ejemplo de la solicitud de cambio
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-solicitud-cambio.json --output output/solicitud.pdf
          python skills/informe-tecnico/scripts/check_report.py output/solicitud.pdf
      - name: Comprobar la muestra publicada del plan de proyecto
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-plan-proyecto.pdf
      - name: Compilar y comprobar ejemplo del plan de proyecto
        run: |
