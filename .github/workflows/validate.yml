          python skills/informe-tecnico/scripts/check_report.py output/requisitos.pdf
      - name: Comprobar la muestra publicada de la ficha de modelo
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-ficha-modelo.pdf
      - name: Compilar y comprobar ejemplo de la ficha de modelo
