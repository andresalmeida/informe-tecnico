      - name: Comprobar la muestra publicada de la evaluación de impacto en datos
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-evaluacion-impacto-datos.pdf
      - name: Compilar y comprobar ejemplo de la evaluación de impacto en datos
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-evaluacion-impacto-datos.json --output output/evaluacion-impacto-datos.pdf
          python skills/informe-tecnico/scripts/check_report.py output/evaluacion-impacto-datos.pdf
      - name: Comprobar la muestra publicada de propuesta-sustituida
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-propuesta-sustituida.pdf
      - name: Compilar y comprobar ejemplo de propuesta-sustituida
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-propuesta-sustituida.json --output output/propuesta-sustituida.pdf
          python skills/informe-tecnico/scripts/check_report.py output/propuesta-sustituida.pdf
      - name: Comprobar la muestra publicada de propuesta-retiro-programado
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-propuesta-retiro-programado.pdf
      - name: Compilar y comprobar ejemplo de propuesta-retiro-programado
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-propuesta-retiro-programado.json --output output/propuesta-retiro-programado.pdf
          python skills/informe-tecnico/scripts/check_report.py output/propuesta-retiro-programado.pdf
      - name: Comprobar la muestra publicada de informe-cierre
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-informe-cierre.pdf
      - name: Compilar y comprobar ejemplo de informe-cierre
        run: |
          python skills/informe-tecnico/scripts/build_report.py skills/informe-tecnico/assets/ejemplo-informe-cierre.json --output output/informe-cierre.pdf
          python skills/informe-tecnico/scripts/check_report.py output/informe-cierre.pdf
      - name: Comprobar la muestra publicada de acta-baja
        run: python skills/informe-tecnico/scripts/check_report.py docs/muestra-acta-baja.pdf
      - name: Compilar y comprobar ejemplo de acta-baja
        run: |
