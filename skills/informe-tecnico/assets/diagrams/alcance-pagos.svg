<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 588 322" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alcance-pagos-title alcance-pagos-desc" id="alcance-pagos-root">
        <title id="alcance-pagos-title">Perímetro del alcance del módulo de pagos</title>
        <desc id="alcance-pagos-desc">Dentro del perímetro se construyen el servicio y el registro de pagos y se ajustan la API de reservas y el cliente web; quedan fuera la pasarela, las notificaciones y los pagos en efectivo y recurrentes.</desc>
        <defs>
      <style>#alcance-pagos-root { --color-paper:   #FFFFFF;   
      --color-ink:     #17232F;   
      --color-muted:   #4F6070;   
      --color-accent:  #155D86;   
      --font-sans:     'Helvetica', Arial, sans-serif;
      --font-serif:    'Helvetica', Arial, sans-serif;
      --font-mono:     'Courier New', ui-monospace, monospace; }
      #alcance-pagos-root { font-family: var(--font-sans); color: var(--color-ink); }
      #alcance-pagos-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#alcance-pagos-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="alcance-pagos-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4F6070"/></marker>
        </defs>

        <rect width="588" height="322" fill="#FFFFFF"/>

        <text x="564" y="16" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="0.14em">DIAGRAMA DEMOSTRATIVO</text>

        <!-- Perímetro: zona de límite dibujada antes que conectores y nodos. Trazo discontinuo de ink al 55 % para llegar a 3:1 sobre blanco. -->
        <rect x="12" y="28" width="360" height="200" rx="8" fill="#17232f" stroke="#17232f" stroke-width="1.2" stroke-dasharray="6,4" fill-opacity="0.02" stroke-opacity="0.55"/>
        <rect x="24" y="32" width="148" height="16" rx="2" fill="#FFFFFF"/>
        <text x="98" y="44" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.14em">DENTRO DEL ALCANCE</text>

        <!-- Conectores -->
        <line x1="164" y1="94" x2="220" y2="94" stroke="#4F6070" stroke-width="1.2" marker-end="url(#alcance-pagos-arrow)"/>
        <line x1="356" y1="94" x2="436" y2="94" stroke="#4F6070" stroke-width="1.2" marker-end="url(#alcance-pagos-arrow)"/>
        <line x1="288" y1="124" x2="288" y2="152" stroke="#4F6070" stroke-width="1.2" marker-end="url(#alcance-pagos-arrow)"/>
        <line x1="220" y1="182" x2="164" y2="182" stroke="#4F6070" stroke-width="1.2" marker-end="url(#alcance-pagos-arrow)"/>
        <line x1="356" y1="170" x2="436" y2="170" stroke="#4F6070" stroke-width="1.2" marker-end="url(#alcance-pagos-arrow)"/>
        <line x1="436" y1="194" x2="356" y2="194" stroke="#4F6070" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#alcance-pagos-arrow)"/>

        <!-- Rótulos de conector -->
        <rect x="380" y="72" width="48" height="16" rx="2" fill="#FFFFFF"/>
        <text x="404" y="84" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">AVISO</text>
        <rect x="296" y="130" width="36" height="16" rx="2" fill="#FFFFFF"/>
        <text x="314" y="142" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">REST</text>
        <rect x="166" y="160" width="52" height="16" rx="2" fill="#FFFFFF"/>
        <text x="192" y="172" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">GUARDA</text>
        <rect x="378" y="148" width="48" height="16" rx="2" fill="#FFFFFF"/>
        <text x="402" y="160" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="376" y="200" width="56" height="16" rx="2" fill="#FFFFFF"/>
        <text x="404" y="212" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>

        <!-- Nodo: Cliente web (E4) -->
        <rect x="28" y="64" width="136" height="60" rx="6" fill="#FFFFFF"/>
        <rect x="28" y="64" width="136" height="60" rx="6" fill="#FFFFFF" stroke="#17232F" stroke-width="1"/>
        <rect x="36" y="72" width="72" height="16" rx="2" fill="none" stroke="#17232f" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="72.0" y="83.5" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">AJUSTE E4</text>
        <text x="96" y="104" fill="#17232F" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Cliente web</text>
        <text x="96" y="118" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">paso de pago</text>
        <!-- Nodo: API de reservas (E3) -->
        <rect x="220" y="64" width="136" height="60" rx="6" fill="#FFFFFF"/>
        <rect x="220" y="64" width="136" height="60" rx="6" fill="#FFFFFF" stroke="#17232F" stroke-width="1"/>
        <rect x="228" y="72" width="72" height="16" rx="2" fill="none" stroke="#17232f" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="264.0" y="83.5" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">AJUSTE E3</text>
        <text x="288" y="104" fill="#17232F" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">API de reservas</text>
        <text x="288" y="118" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">pago pendiente</text>
        <!-- Nodo: Notificaciones (fuera del perímetro, sin cambios) -->
        <rect x="436" y="64" width="136" height="60" rx="6" fill="#FFFFFF"/>
        <rect x="436" y="64" width="136" height="60" rx="6" fill="#17232f" stroke="#17232f" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.55"/>
        <rect x="444" y="72" width="88" height="16" rx="2" fill="none" stroke="#17232f" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="488.0" y="83.5" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">SIN CAMBIOS</text>
        <text x="504" y="104" fill="#17232F" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Notificaciones</text>
        <text x="504" y="118" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">correo · SMS</text>
        <!-- Nodo: Registro de pagos (E2) -->
        <rect x="28" y="152" width="136" height="60" rx="6" fill="#FFFFFF"/>
        <rect x="28" y="152" width="136" height="60" rx="6" fill="#155d86" stroke="#155D86" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="36" y="160" width="80" height="16" rx="2" fill="none" stroke="#155d86" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="76.0" y="171.5" fill="#155D86" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">ENTREGA E2</text>
        <text x="96" y="192" fill="#17232F" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Registro de pagos</text>
        <text x="96" y="206" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">tabla SQL</text>
        <!-- Nodo: Servicio de pagos (E1) -->
        <rect x="220" y="152" width="136" height="60" rx="6" fill="#FFFFFF"/>
        <rect x="220" y="152" width="136" height="60" rx="6" fill="#155d86" stroke="#155D86" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="228" y="160" width="80" height="16" rx="2" fill="none" stroke="#155d86" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="268.0" y="171.5" fill="#155D86" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">ENTREGA E1</text>
        <text x="288" y="192" fill="#17232F" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Servicio de pagos</text>
        <text x="288" y="206" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">REST · webhook</text>
        <!-- Nodo: Pasarela de pagos (externa) -->
        <rect x="436" y="152" width="136" height="60" rx="6" fill="#FFFFFF"/>
        <rect x="436" y="152" width="136" height="60" rx="6" fill="#17232f" stroke="#17232f" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.55"/>
        <rect x="444" y="160" width="60" height="16" rx="2" fill="none" stroke="#17232f" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="474.0" y="171.5" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">EXTERNO</text>
        <text x="504" y="192" fill="#17232F" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Pasarela de pagos</text>
        <text x="504" y="206" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">API HTTPS · SDK</text>

        <!-- Exclusiones: lo que el alcance deja fuera de forma expresa -->
        <text x="24" y="260" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="start" letter-spacing="0.14em">FUERA DEL ALCANCE</text>
        <rect x="176" y="244" width="128" height="24" rx="6" fill="#FFFFFF"/>
        <rect x="176" y="244" width="128" height="24" rx="6" fill="#17232f" stroke="#17232f" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.55"/>
        <text x="240" y="260" fill="#4F6070" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Pagos en efectivo</text>
        <rect x="320" y="244" width="128" height="24" rx="6" fill="#FFFFFF"/>
        <rect x="320" y="244" width="128" height="24" rx="6" fill="#17232f" stroke="#17232f" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.55"/>
        <text x="384" y="260" fill="#4F6070" font-size="12" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle" font-weight="600">Pagos recurrentes</text>

        <!-- Leyenda: franja horizontal inferior -->
        <line x1="24" y1="284" x2="564" y2="284" stroke="#CED6DD" stroke-width="0.8"/>
        <text x="24" y="306" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="start" letter-spacing="0.18em">LEYENDA</text>
        <rect x="112" y="297" width="14" height="10" rx="2" fill="#155d86" stroke="#155D86" stroke-width="1.4" fill-opacity="0.08"/>
        <text x="132" y="306" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif" text-anchor="start">Se construye</text>
        <rect x="212" y="297" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#17232F" stroke-width="1"/>
        <text x="232" y="306" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif" text-anchor="start">Se ajusta</text>
        <rect x="296" y="297" width="14" height="10" rx="2" fill="#17232f" stroke="#17232f" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.55"/>
        <text x="316" y="306" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif" text-anchor="start">Fuera del perímetro</text>
        <rect x="432" y="297" width="14" height="10" rx="2" fill="#17232f" stroke="#17232f" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.55"/>
        <text x="452" y="306" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif" text-anchor="start">Excluido</text>
      </svg>
