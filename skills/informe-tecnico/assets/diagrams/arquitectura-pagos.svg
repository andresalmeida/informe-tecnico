<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 584 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-pagos-title arquitectura-pagos-desc" id="arquitectura-pagos-root">
        <title id="arquitectura-pagos-title">Arquitectura propuesta del módulo de pagos</title>
        <desc id="arquitectura-pagos-desc">El cliente web llama a la API de reservas, que delega el cobro en un servicio de pagos nuevo; este llama a la pasarela externa, guarda las transacciones en un registro propio y recibe las confirmaciones por webhook.</desc>
        <defs>
      <style>#arquitectura-pagos-root { --color-paper:   #FFFFFF;   
      --color-ink:     #17232F;   
      --color-muted:   #4F6070;   
      --color-accent:  #155D86;   
      --font-sans:     'Helvetica', Arial, sans-serif;
      --font-serif:    'Helvetica', Arial, sans-serif;
      --font-mono:     'Courier New', ui-monospace, monospace; }
      #arquitectura-pagos-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arquitectura-pagos-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#arquitectura-pagos-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="arquitectura-pagos-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4F6070"/></marker>
          <marker id="arquitectura-pagos-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#155D86"/></marker>
        </defs>

        <rect width="584" height="312" fill="#FFFFFF"/>

        <text x="560" y="20" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="0.14em">DIAGRAMA DEMOSTRATIVO</text>

        <!-- Conectores primero, detrás de los nodos. Todos rectos entre puertos alineados, con rótulo sobre una máscara opaca a 8 unidades del trazo. -->
        <line x1="160" y1="64" x2="224" y2="64" stroke="#4F6070" stroke-width="1.2" marker-end="url(#arquitectura-pagos-arrow)"/>
        <line x1="360" y1="64" x2="424" y2="64" stroke="#4F6070" stroke-width="1.2" marker-end="url(#arquitectura-pagos-arrow)"/>
        <line x1="292" y1="96" x2="292" y2="144" stroke="#4F6070" stroke-width="1.2" marker-end="url(#arquitectura-pagos-arrow)"/>
        <line x1="360" y1="164" x2="424" y2="164" stroke="#155D86" stroke-width="1.4" marker-end="url(#arquitectura-pagos-arrow-accent)"/>
        <line x1="424" y1="188" x2="360" y2="188" stroke="#4F6070" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arquitectura-pagos-arrow)"/>
        <line x1="224" y1="176" x2="160" y2="176" stroke="#4F6070" stroke-width="1.2" marker-end="url(#arquitectura-pagos-arrow)"/>

        <!-- Rótulos de conector -->
        <rect x="170" y="40" width="44" height="16" rx="2" fill="#FFFFFF"/>
        <text x="192" y="52" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="370" y="40" width="44" height="16" rx="2" fill="#FFFFFF"/>
        <text x="392" y="52" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">AVISO</text>
        <rect x="302" y="112" width="36" height="16" rx="2" fill="#FFFFFF"/>
        <text x="320" y="124" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">REST</text>
        <rect x="370" y="140" width="44" height="16" rx="2" fill="#FFFFFF"/>
        <text x="392" y="152" fill="#155D86" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="364" y="196" width="56" height="16" rx="2" fill="#FFFFFF"/>
        <text x="392" y="208" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>
        <rect x="168" y="152" width="48" height="16" rx="2" fill="#FFFFFF"/>
        <text x="192" y="164" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">GUARDA</text>

        <!-- Nodo: Cliente web -->
        <rect x="24" y="32" width="136" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="24" y="32" width="136" height="64" rx="6" fill="#17232f" stroke="#17232f" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.55"/>
        <rect x="32" y="40" width="56" height="16" rx="2" fill="none" stroke="#17232f" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="60" y="51.5" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">EXTERNO</text>
        <text x="92" y="74" fill="#17232F" font-size="12" font-weight="600" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle">Cliente web</text>
        <text x="92" y="88" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">web · móvil</text>
        <!-- Nodo: API de reservas -->
        <rect x="224" y="32" width="136" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="224" y="32" width="136" height="64" rx="6" fill="#FFFFFF" stroke="#17232F" stroke-width="1"/>
        <text x="292" y="74" fill="#17232F" font-size="12" font-weight="600" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle">API de reservas</text>
        <text x="292" y="88" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">REST · token</text>
        <!-- Nodo: Notificaciones -->
        <rect x="424" y="32" width="136" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="424" y="32" width="136" height="64" rx="6" fill="#FFFFFF" stroke="#17232F" stroke-width="1"/>
        <text x="492" y="74" fill="#17232F" font-size="12" font-weight="600" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle">Notificaciones</text>
        <text x="492" y="88" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">correo · SMS</text>
        <!-- Nodo: Registro de pagos -->
        <rect x="24" y="144" width="136" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="24" y="144" width="136" height="64" rx="6" fill="#17232f" stroke="#4F6070" stroke-width="1" fill-opacity="0.05"/>
        <rect x="32" y="152" width="44" height="16" rx="2" fill="none" stroke="#4f6070" stroke-width="0.8" stroke-opacity="0.60"/>
        <text x="54" y="163.5" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">NUEVO</text>
        <text x="92" y="186" fill="#17232F" font-size="12" font-weight="600" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle">Registro de pagos</text>
        <text x="92" y="200" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">tabla SQL</text>
        <!-- Nodo: Servicio de pagos -->
        <rect x="224" y="144" width="136" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="224" y="144" width="136" height="64" rx="6" fill="#155d86" stroke="#155D86" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="232" y="152" width="44" height="16" rx="2" fill="none" stroke="#155d86" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="254" y="163.5" fill="#155D86" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">NUEVO</text>
        <text x="292" y="186" fill="#17232F" font-size="12" font-weight="600" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle">Servicio de pagos</text>
        <text x="292" y="200" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">REST · webhook</text>
        <!-- Nodo: Pasarela de pagos -->
        <rect x="424" y="144" width="136" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="424" y="144" width="136" height="64" rx="6" fill="#17232f" stroke="#17232f" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.55"/>
        <rect x="432" y="152" width="56" height="16" rx="2" fill="none" stroke="#17232f" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="460" y="163.5" fill="#566676" font-size="10" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">EXTERNO</text>
        <text x="492" y="186" fill="#17232F" font-size="12" font-weight="600" font-family="'Helvetica', Arial, sans-serif" text-anchor="middle">Pasarela de pagos</text>
        <text x="492" y="200" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" text-anchor="middle">API HTTPS · SDK</text>

        <!-- Leyenda: franja horizontal inferior -->
        <line x1="24" y1="236" x2="560" y2="236" stroke="#CED6DD" stroke-width="0.8"/>
        <text x="24" y="254" fill="#4F6070" font-size="10" font-family="'Courier New', monospace" letter-spacing="0.18em">LEYENDA</text>
        <rect x="24" y="263" width="14" height="10" rx="2" fill="#155d86" stroke="#155D86" stroke-width="1.4" fill-opacity="0.08"/>
        <text x="44" y="272" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Componente nuevo</text>
        <rect x="148" y="263" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#17232F" stroke-width="1"/>
        <text x="168" y="272" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Componente actual</text>
        <rect x="280" y="263" width="14" height="10" rx="2" fill="#17232f" stroke="#4F6070" stroke-width="1" fill-opacity="0.05"/>
        <text x="300" y="272" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Almacén de datos</text>
        <rect x="404" y="263" width="14" height="10" rx="2" fill="#17232f" stroke="#17232f" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.55"/>
        <text x="424" y="272" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Sistema externo</text>
        <line x1="24" y1="290" x2="52" y2="290" stroke="#155D86" stroke-width="1.4" marker-end="url(#arquitectura-pagos-arrow-accent)"/>
        <text x="60" y="294" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Integración evaluada</text>
        <line x1="188" y1="290" x2="216" y2="290" stroke="#4F6070" stroke-width="1.2" marker-end="url(#arquitectura-pagos-arrow)"/>
        <text x="224" y="294" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Llamada</text>
        <line x1="284" y1="290" x2="312" y2="290" stroke="#4F6070" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arquitectura-pagos-arrow)"/>
        <text x="320" y="294" fill="#4F6070" font-size="10" font-family="'Helvetica', Arial, sans-serif">Confirmación asíncrona</text>
      </svg>
